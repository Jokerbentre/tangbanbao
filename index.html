<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quà</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    font-family: Arial, sans-serif;
    padding: 20px;
  }
  #btnGift {
    padding: 18px 50px;
    font-size: 22px;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(45deg, #e63946, #f77f00);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(230, 57, 70, 0.7);
    animation: pulse 1.2s infinite;
    transition: transform 0.2s;
  }
  #btnGift:hover { transform: scale(1.08); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 20px rgba(230, 57, 70, 0.7); }
    50% { box-shadow: 0 0 40px rgba(247, 127, 0, 1); }
  }
  #giftBox {
    display: none;
    flex-direction: column;
    align-items: center;
    margin-top: 25px;
    animation: fadeIn 0.6s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  #giftBox img {
    max-width: 90vw;
    max-height: 60vh;
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
  }
  #giftText {
    margin-top: 18px;
    font-size: 24px;
    font-weight: bold;
    color: #ffd700;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
    text-align: center;
  }
</style>
</head>
<body>

<button id="btnGift">🎁 Bấm vào để thấy quà</button>

<div id="giftBox">
  <img id="giftImg" src="https://cdn.phototourl.com/member/2026-10-17-270d6126-cdce-47db-b11d-028d2b1e4ff4.png" alt="Quà tặng">
  <div id="giftText">Quét đi được tiền đấy tin t</div>
</div>

<script>
  // Lấy các phần tử DOM cần thao tác
  const btn = document.getElementById('btnGift');
  const giftBox = document.getElementById('giftBox');

  // Gắn sự kiện click: ẩn nút, hiện khối quà gồm ảnh và dòng chữ
  btn.addEventListener('click', function () {
    btn.style.display = 'none';
    giftBox.style.display = 'flex';
  });
</script>

</body>
</html>
